  #btn-dead .ico { background: #222; rotate: 8deg; }
  .choice .lbl { background: #fff; border: 3px solid #111; border-radius: 99px; padding: 2px 12px; }
  .choice:hover .ico { animation: wiggle .35s; }
  .choice:active .ico { translate: 4px 4px; box-shadow: 1px 1px 0 #111; }
  .choice:focus-visible .ico { outline: 4px dashed #ff3ea5; outline-offset: 4px; }

  .result {

  button small { display: block; font-family: system-ui, sans-serif; font-size: 12px; font-weight: 600; }
  .lvl { padding: 7px 22px; min-width: 210px; }
  .back { font-size: 14px; padding: 6px 14px; box-shadow: 2px 2px 0 #111; }
  .drop { position: fixed; top: -60px; pointer-events: none; z-index: 9; animation: fall 2.2s linear forwards; }

  .shake { animation: shake .4s; } @keyframes shake { 20%, 60% { transform: translateX(-12px); } 40%, 80% { transform: translateX(12px); } }

// sons fabriqués par le navigateur (aucun fichier à charger)
let ac;
function beep(notes, type = "square") {
  if (muted) return;
  try {
    ac ??= new (window.AudioContext || window.webkitAudioContext)();
    let t0 = ac.currentTime;
    for (const [f, d] of notes) {
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = type; o.frequency.value = f;
      g.gain.setValueAtTime(0.12, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + d);
      o.connect(g).connect(ac.destination); o.start(t0); o.stop(t0 + d); t0 += d * 0.9;
    }
  } catch {}
}

function rain(emoji, n = 26) {
  for (let k = 0; k < n; k++) {
    const d = document.createElement("span");
    d.className = "drop"; d.textContent = emoji; d.setAttribute("aria-hidden", "true");
    d.style.left = Math.random() * 95 + "vw"; d.style.fontSize = 20 + Math.random() * 26 + "px"; d.style.animationDelay = Math.random() * .7 + "s";
    document.body.append(d); setTimeout(() => d.remove(), 3000);
  }
}

// entre 30 % et 70 % de morts par manche (borné par ce qui reste), en évitant les célébrités déjà vues
function makeDeck() {
  const all = CELEBS.filter(c => !intl || !FR_ONLY.has(c.name));
  ROUND = Math.min(ROUND, all.length);
  let pool = all.filter(c => !seen.has(c.name));
  if (pool.length < ROUND) { all.forEach(c => seen.delete(c.name)); pool = all; } // presque tout vu : on recommence
  const dead = shuffle(pool.filter(c => c.d)), alive = shuffle(pool.filter(c => !c.d));
  const nDead = Math.min(dead.length, Math.max(ROUND - alive.length, Math.round(ROUND * (0.3 + Math.random() * 0.4))));
  return shuffle([...dead.slice(0, nDead), ...alive.slice(0, ROUND - nDead)]);
}

  if (next?.img) new Image().src = next.img; // précharge la photo suivante
  $("stage").innerHTML = `
    <div class="card" id="card">
      <div class="stamp dead">${t("MORT", "DEAD")}</div><div class="stamp alive">${t("PAS MORT", "NOT DEAD")}</div>
      ${c.img ? `<img class="photo" src="${c.img}" alt="" onerror="this.outerHTML='<div class=face>${face()}</div>'">` : `<div class="face">${face()}</div>`}
      <div class="name">${label(c)}</div>
      <div class="hint">${t("Alors, il/elle respire encore ?", "So… still breathing?")}</div>
    </div>`;
  drag($("card"));
}

function drag(card) {
  let x0 = null, dx = 0;
  const [dead, alive] = card.querySelectorAll(".stamp");
  card.onpointerdown = e => { x0 = e.clientX; card.setPointerCapture(e.pointerId); card.style.transition = "none"; };
  card.onpointermove = e => {
    if (x0 === null) return;
    dx = e.clientX - x0;
    card.style.transform = `translateX(${dx}px) rotate(${dx / 15}deg)`;
    alive.style.opacity = Math.max(0, -dx / 100); dead.style.opacity = Math.max(0, dx / 100);
    grow(-dx);
  };
  card.onpointerup = card.onpointercancel = () => {
    x0 = null;
    if (Math.abs(dx) > 100) return answer(dx < 0);
    card.style.transition = "transform .2s"; card.style.transform = "";
    dead.style.opacity = alive.style.opacity = 0; dx = 0; grow(0);
  };
}

function answer(saysAlive) {
  if (locked || i >= ROUND) return;
  locked = true;
  const c = deck[i], isAlive = c.d === null, ok = saysAlive === isAlive;
  seen.add(c.name); saveSeen();
  const card = $("card");
  card.style.transition = "transform .3s";
  card.style.transform = `translateX(${saysAlive ? -600 : 600}px) rotate(${saysAlive ? -30 : 30}deg)`;
  if (ok) { score++; streak++; best = Math.max(best, streak); } else { streak = 0; lives--; }
  // nouveau record : la série dépasse le record d'avant la partie (fêté une seule fois, pas à la toute 1re partie)
  const newRecord = ok && recordAtStart > 0 && streak === recordAtStart + 1;
  if (streak > record) { record = streak; store("record", record); }
  hud();
  newRecord ? SFX.record() : ok ? SFX.ok() : SFX.ko();
  setTimeout(() => {
    $("stage").innerHTML = `
      <div class="result ${ok ? "ok pop" : "ko shake"}">
        <div class="big">${ok ? t("BIEN VU 😎", "NAILED IT 😎") : t("RATÉ 🤡", "WRONG 🤡")}</div>
        <p>${label(c)}</p>
        <p>${isAlive ? t("🫀 Toujours vivant(e), merci pour lui/elle.", "🫀 Still alive, good for them.") : t(`💀 Décédé(e) en ${c.d}. RIP.`, `💀 Died in ${c.d}. RIP.`)}</p>
        ${newRecord ? `<p class="record">${t("NOUVEAU RECORD", "NEW RECORD")} 🔥 ${streak}</p>` : ""}
      </div>`;
    if (newRecord) rain("🔥", 18);
    setTimeout(() => { lives <= 0 ? end(true) : ++i < ROUND ? showCard() : end(false); }, newRecord ? 1900 : 1400);
  }, 250);
}

function end(gameOver) {
  $("buttons").hidden = true;
  gameOver ? (SFX.over(), rain("💀")) : (SFX.win(), rain("🎉"));
  const pct = score / ROUND;
  const verdict = pct >= 0.9 ? t("Nécrologue de génie 🏆", "Obituary genius 🏆") : pct >= 0.6 ? t("Pas mal pour un vivant 👍", "Not bad for a living person 👍") : pct >= 0.3 ? t("Tu lis pas les journaux toi 📰", "You don't read the news, do you? 📰") : t("Toi-même t'es sûr d'être vivant ? 🧟", "Are you sure YOU are alive? 🧟");
  $("stage").innerHTML = `
    <div class="result ${gameOver ? "ko shake" : "ok pop"}">
      <div class="big">${gameOver ? "GAME OVER" : `${score}/${ROUND}`}</div>
      ${gameOver ? `<p>${t(`Éliminé à la carte ${i + 1} · score ${score}/${ROUND}`, `Out at card ${i + 1} · score ${score}/${ROUND}`)}</p>` : ""}
      <p>${verdict}</p><p>${t("Meilleure série :", "Best streak:")} 🔥 ${best} · ${t("record", "record")} 🔥 ${record}</p>
      ${deck === defi ? `<p>${score > defiScore ? t("Tu as battu ton pote 🥇", "You beat your friend 🥇") : score === defiScore ? t("Égalité avec ton pote 🤝", "It's a tie 🤝") : t("Ton pote t'a battu 🥈", "Your friend beat you 🥈")}</p>` : ""}
      <button id="share">📣 ${t("Défier mes potes", "Challenge my friends")}</button>
      <button id="again">🔄 ${t("Rejouer", "Play again")}</button>
    </div>`;
  $("again").onclick = () => { defi = []; menu(); };
  $("share").onclick = async () => {
    const link = ON_GITHUB ? defiLink() : GAME_URL;
    const same = ON_GITHUB ? t("Mêmes célébrités pour toi, fais mieux", "Same celebrities for you, beat me") : t("Fais mieux", "Beat me"); // hors GitHub le lien ne porte pas le défi
    const text = t(`J'ai fait ${score}/${ROUND} à MORT ou PAS MORT ? 💀🫀 ${same} : ${link}`, `I scored ${score}/${ROUND} at DEAD or NOT DEAD? 💀🫀 ${same}: ${link}`);
    try { await navigator.share({ text }); } catch (e) {
      if (e.name === "AbortError") return; // partage annulé par le joueur : ne rien copier
      try { await navigator.clipboard.writeText(text); $("share").textContent = t("✅ Copié, colle-le à tes potes !", "✅ Copied, paste it to your friends!"); }
      catch { $("share").textContent = t("😬 Copie impossible", "😬 Couldn't copy"); }
    }
  };
}

$("btn-dead").onclick = () => answer(false);
const muteIcon = () => { $("mute").textContent = muted ? "🔇" : "🔊"; $("mute").ariaLabel = muted ? t("Activer le son", "Sound on") : t("Couper le son", "Sound off"); };
$("mute").onclick = () => { muted = !muted; store("muted", muted ? "1" : "0"); muteIcon(); };
muteIcon();
$("btn-alive").onclick = () => answer(true);
document.onkeydown = e => { if (e.key === "ArrowLeft") answer(true); if (e.key === "ArrowRight") answer(false); };
menu();
</script>
</body>
</html>
