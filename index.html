  .hud { display: flex; gap: 10px; font-size: 15px; }
  .hud span { background: #fff; border: 3px solid #111; padding: 4px 10px; border-radius: 99px; box-shadow: 3px 3px 0 #111; }
  .stage { position: relative; width: min(340px, 90vw); height: clamp(300px, 100dvh - 370px, 440px); }
  .card {
    position: absolute; inset: 0; background: #fff; border: 4px solid #111; border-radius: 22px;
    box-shadow: 8px 8px 0 #111; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 14px; padding: 20px; text-align: center; touch-action: none; cursor: grab;
  }
  .card .face { font-size: 90px; }
  .card .photo { width: min(190px, 26dvh); height: min(190px, 26dvh); object-fit: cover; object-position: top; border-radius: 50%; border: 4px solid #111; background: #ffe94d; pointer-events: none; }
  .card .name { font-size: clamp(26px, 7vw, 34px); line-height: 1.05; }
  .card .hint { font-family: system-ui, sans-serif; font-size: 15px; color: #555; }
  .stamp { position: absolute; top: 24px; font-size: 26px; padding: 4px 12px; border: 4px solid; border-radius: 10px; opacity: 0; }
  .stamp.dead { right: 18px; color: #111; transform: rotate(14deg); }
  .stamp.alive { left: 18px; color: #00a86b; transform: rotate(-14deg); }
  .buttons { display: flex; gap: 44px; }
  button {
    font: inherit; font-size: 18px; border: 4px solid #111; border-radius: 99px; padding: 12px 20px;
    box-shadow: 4px 4px 0 #111; cursor: pointer; background: #fff; color: #111;
  }
  button:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 #111; }
  .choice { all: unset; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 8px; font-size: 17px; }
  .choice .ico {
    width: 84px; height: 84px; border-radius: 50%; border: 4px solid #111; box-shadow: 5px 5px 0 #111;
    display: grid; place-items: center; font-size: 40px; transition: scale .1s, box-shadow .1s, translate .1s;
  }
  #btn-alive .ico { background: #3df5a7; rotate: -8deg; }
  #btn-dead .ico { background: #222; rotate: 8deg; }
  .choice .lbl { background: #fff; border: 3px solid #111; border-radius: 99px; padding: 2px 12px; }
  .choice:hover .ico { animation: wiggle .35s; }
  .choice:active .ico { translate: 4px 4px; box-shadow: 1px 1px 0 #111; }
  .choice:focus-visible .ico { outline: 4px dashed #ff3ea5; outline-offset: 4px; }
  @keyframes wiggle { 25% { transform: rotate(-12deg); } 75% { transform: rotate(12deg); } }
  .result {
    position: absolute; inset: 0; border: 4px solid #111; border-radius: 22px; box-shadow: 8px 8px 0 #111;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
    padding: 20px; text-align: center;
  }
  .result.ok { background: #3df5a7; } .result.ko { background: #ff3ea5; color: #fff; }
  .result .big { font-size: 40px; } .result p { font-family: system-ui, sans-serif; font-size: 18px; font-weight: 700; }
  .footer { font-family: system-ui, sans-serif; font-size: 12px; color: #333; text-align: center; max-width: 340px; }
  [hidden] { display: none !important; }

  ["Gérard Holtz", null, "https://upload.wikimedia.org/wikipedia/commons/thumb/c/c9/G%C3%A9rard_Holtz.JPG/330px-G%C3%A9rard_Holtz.JPG", "photos/gerard-holtz.jpg"],

  ["Jean-Claude Van Damme", null, "https://upload.wikimedia.org/wikipedia/commons/thumb/b/b2/Van_Damme_Cannes_2010_%28cropped%29.jpg/330px-Van_Damme_Cannes_2010_%28cropped%29.jpg", "photos/jean-claude-van-damme.jpg"],
  ["Annie Cordy", 2020, "https://upload.wikimedia.org/wikipedia/commons/thumb/9/95/Annie_Cordy_Cannes.jpg/330px-Annie_Cordy_Cannes.jpg", "photos/annie-cordy.jpg"],
  ["Françoise Hardy", 2024, "https://upload.wikimedia.org/wikipedia/commons/thumb/a/a4/Francoise_hardy_1964.jpg/330px-Francoise_hardy_1964.jpg", "photos/francoise-hardy.jpg"],
  ["Catherine Deneuve", null, "https://upload.wikimedia.org/wikipedia/commons/thumb/c/ce/Catherine_Deneuve_Berlinale_2017.jpg/330px-Catherine_Deneuve_Berlinale_2017.jpg", "photos/catherine-deneuve.jpg"],
  ["Claudia Cardinale", 2025, "https://upload.wikimedia.org/wikipedia/commons/thumb/1/11/Claudia_Cardinale_1963.jpg/330px-Claudia_Cardinale_1963.jpg", "photos/claudia-cardinale.jpg"],
  ["Michel Polnareff", null, "https://upload.wikimedia.org/wikipedia/commons/thumb/b/b9/Michel_polnareff_bercy.jpg/330px-Michel_polnareff_bercy.jpg", "photos/michel-polnareff.jpg"]
].map(([name, d, web, local]) => ({ name, d, img: LINKED ? web : local }));
const GAME_URL = ON_GITHUB ? location.origin + location.pathname : "https://claude.ai/artifact/52W3j34ZndtWLzpGRtNWuC";
const face = () => FACES[Math.floor(Math.random() * FACES.length)];
const shuffle = a => { for (let k = a.length - 1; k > 0; k--) { const j = Math.floor(Math.random() * (k + 1)); [a[k], a[j]] = [a[j], a[k]]; } return a; };
// entre 30 % et 70 % de morts par manche : jamais tout l'un ou tout l'autre, mais pas devinable non plus
function makeDeck() {
  const nDead = Math.round(ROUND * (0.3 + Math.random() * 0.4));
  return shuffle([...shuffle(CELEBS.filter(c => c.d)).slice(0, nDead), ...shuffle(CELEBS.filter(c => !c.d)).slice(0, ROUND - nDead)]);
}
console.assert(CELEBS.every(c => c.name && (c.d === null || c.d > 1900)), "données invalides");

const FACES = ["🕶️", "🎤", "🎬", "👑", "🎸", "💃", "🕺", "🎭", "🥸", "🤠"];
let ROUND = 10;
const $ = id => document.getElementById(id);
let deck, i, score, streak, best, locked;

function menu() {
  $("buttons").hidden = true; locked = true;
  $("stage").innerHTML = `
    <div class="result ok">
      <div class="big">PRÊT ?</div>
      <p>Combien de célébrités tu veux enterrer… ou pas ?</p>
      <button id="quick">⚡ Partie rapide · 10</button>
      <button id="marathon">🏃 Marathon · 100</button>
    </div>`;
  $("quick").onclick = () => start(10);
  $("marathon").onclick = () => start(100);
}

function start(n) {
  ROUND = n; deck = makeDeck();
  i = 0; score = 0; streak = 0; best = 0;
  $("buttons").hidden = false;
  showCard();
}

function hud() {
  $("progress").textContent = `${Math.min(i + 1, ROUND)}/${ROUND}`;
  $("score").textContent = `Score : ${score}`;
  $("streak").textContent = `🔥 ${streak}`;
}

function grow(dx) {
  $("btn-alive").firstChild.style.scale = 1 + Math.min(Math.max(dx, 0), 120) / 480;
  $("btn-dead").firstChild.style.scale = 1 + Math.min(Math.max(-dx, 0), 120) / 480;
}

function showCard() {
  hud(); locked = false; grow(0);
  const c = deck[i], next = deck[i + 1];
  if (next?.img) new Image().src = next.img; // précharge la photo suivante
  $("stage").innerHTML = `
    <div class="card" id="card">
      <div class="stamp dead">MORT</div><div class="stamp alive">PAS MORT</div>
      ${c.img ? `<img class="photo" src="${c.img}" alt="" onerror="this.outerHTML='<div class=face>${face()}</div>'">` : `<div class="face">${face()}</div>`}
      <div class="name">${c.name}</div>
      <div class="hint">Alors, il/elle respire encore ?</div>
    </div>`;
  drag($("card"));
}

function drag(card) {
  let x0 = null, dx = 0;
  const [dead, alive] = card.querySelectorAll(".stamp");
  card.onpointerdown = e => { x0 = e.clientX; card.setPointerCapture(e.pointerId); card.style.transition = "none"; };
  card.onpointermove = e => {
    if (x0 === null) return;
    dx = e.clientX - x0;
    card.style.transform = `translateX(${dx}px) rotate(${dx / 15}deg)`;
    alive.style.opacity = Math.max(0, -dx / 100); dead.style.opacity = Math.max(0, dx / 100);
    grow(-dx);
  };
  card.onpointerup = card.onpointercancel = () => {
    x0 = null;
    if (Math.abs(dx) > 100) return answer(dx < 0);
    card.style.transition = "transform .2s"; card.style.transform = "";
    dead.style.opacity = alive.style.opacity = 0; dx = 0; grow(0);
  };
}

function answer(saysAlive) {
  if (locked || i >= ROUND) return;
  locked = true;
  const c = deck[i], isAlive = c.d === null, ok = saysAlive === isAlive;
  const card = $("card");
  card.style.transition = "transform .3s";
  card.style.transform = `translateX(${saysAlive ? -600 : 600}px) rotate(${saysAlive ? -30 : 30}deg)`;
  if (ok) { score++; streak++; best = Math.max(best, streak); } else streak = 0;
  hud();
  setTimeout(() => {
    $("stage").innerHTML = `
      <div class="result ${ok ? "ok" : "ko"}">
        <div class="big">${ok ? "BIEN VU 😎" : "RATÉ 🤡"}</div>
        <p>${c.name}</p>
        <p>${isAlive ? "🫀 Toujours vivant(e), merci pour lui/elle." : `💀 Décédé(e) en ${c.d}. RIP.`}</p>
      </div>`;
    setTimeout(() => { i++; i < ROUND ? showCard() : end(); }, 1400);
  }, 250);
}

function end() {
  $("buttons").hidden = true;
  const pct = score / ROUND;
  const verdict = pct >= 0.9 ? "Nécrologue de génie 🏆" : pct >= 0.6 ? "Pas mal pour un vivant 👍" : pct >= 0.3 ? "Tu lis pas les journaux toi 📰" : "Toi-même t'es sûr d'être vivant ? 🧟";
  $("stage").innerHTML = `
    <div class="result ok">
      <div class="big">${score}/${ROUND}</div>
      <p>${verdict}</p><p>Meilleure série : 🔥 ${best}</p>
      <button id="share">📣 Défier mes potes</button>
      <button id="again">🔄 Rejouer</button>
    </div>`;
  $("again").onclick = menu;
  $("share").onclick = async () => {
    const text = `J'ai fait ${score}/${ROUND} à MORT ou PAS MORT ? 💀🫀 Fais mieux : ${GAME_URL}`;
    try { await navigator.share({ text }); } catch {
      try { await navigator.clipboard.writeText(text); $("share").textContent = "✅ Copié, colle-le à tes potes !"; }
      catch { $("share").textContent = "😬 Copie impossible"; }
    }
  };
}

$("btn-dead").onclick = () => answer(false);
$("btn-alive").onclick = () => answer(true);
document.onkeydown = e => { if (e.key === "ArrowLeft") answer(true); if (e.key === "ArrowRight") answer(false); };
menu();
</script>
